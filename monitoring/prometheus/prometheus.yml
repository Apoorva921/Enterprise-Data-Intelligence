global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "data_platform_backend"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["backend:8000", "host.docker.internal:8000"]

  - job_name: "prometheus_internal"
    static_configs:
      - targets: ["localhost:9090"]
