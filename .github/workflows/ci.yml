name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic test dataset
        run: |
          python scripts/generate_data.py --records 5000 --customers 500 --output data/raw

      - name: Execute Pytest test suites (Unit, Integration, Data Quality)
        run: |
          pytest tests/ -v --tb=short

      - name: Run end-to-end Medallion pipeline verification
        run: |
          python scripts/run_all_pipelines.py

  frontend-build:
    name: Frontend Lint & TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install npm dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React application
        run: |
          cd frontend
          npm run build

  docker-validation:
    name: Dockerfile & Compose Syntax Validation
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
