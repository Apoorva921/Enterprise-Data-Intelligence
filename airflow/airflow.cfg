[core]
dags_folder = /opt/airflow/dags
base_log_folder = /opt/airflow/logs
executor = LocalExecutor
sql_alchemy_conn = postgresql+psycopg2://postgres:postgrespassword@postgres:5432/ecommerce_dw
load_examples = False
donot_pickle = True
dag_concurrency = 16
parallelism = 32

[webserver]
base_url = http://localhost:8080
web_server_host = 0.0.0.0
web_server_port = 8080
expose_config = True
authenticate = False

[scheduler]
job_heartbeat_sec = 5
scheduler_heartbeat_sec = 5
min_file_process_interval = 10
dag_dir_list_interval = 30

